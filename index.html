<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070912">
  <title>Sitcom English in Action</title>
  <link rel="stylesheet" href="css/style.css?v=2.0.9">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Global navigation"></aside>
    <div class="app-column">
      <header class="topbar">
        <button id="backButton" class="icon-button back-button" type="button" aria-label="Back">←</button>
        <button id="searchButton" class="icon-button" type="button" aria-label="Universal Search">⌕</button>
      </header>
      <div id="desktopContextBar" class="desktop-contextbar" hidden>
        <button id="desktopBackButton" class="text-button desktop-back-button" type="button">← Back</button>
      </div>
      <main id="app" class="main" tabindex="-1">
        <section class="loading-card">Loading data…</section>
      </main>
    </div>
  </div>
  <nav id="bottomNav" class="bottom-nav" aria-label="Global navigation"></nav>
  <div id="modalRoot"></div>
  <script src="js/app.js?v=2.0.9" defer></script>
</body>
</html>
