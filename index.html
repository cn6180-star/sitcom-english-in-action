<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitcom English in Action</title>
<link rel="stylesheet" href="css/style.css"></head>
<body><div class="wrap">
<h1>Sitcom English in Action</h1><div id="appSubtitle" class="sub">Loading data…</div>
<section id="home" class="card"><div class="title">学習メニュー</div><div class="meta">フレーズで意味を学び、ダイアログで使える形にする統合版。</div><button class="btn blue" onclick="showPhraseHome('all')">📘 フレーズ</button><button class="btn green" onclick="showRoleHome('all')">🎭 ロールプレイ</button><button class="btn soft" onclick="showSearch()">🔎 検索</button><button class="btn white" onclick="currentBookmarkTab='phrase';showBookmarks()">⭐ ブックマーク</button><button class="btn white" onclick="showQuizHome()">🧠 フレーズクイズ</button><div class="stats"><div class="stat"><small>フレーズ</small><b id="phraseCount">—</b></div><div class="stat"><small>ダイアログ</small><b id="dialogueCount">—</b></div><div class="stat"><small>Season</small><b id="seasonRange">—</b></div></div></section>

<section id="phraseSeason" class="card hidden"><div class="top"><button class="small" onclick="goHome()">← 戻る</button><div class="topActions"><button class="small" onclick="showSearch()">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div class="title">フレーズ：シーズン選択</div><div id="phraseSeasonButtons"></div></section>
<section id="phraseHome" class="card hidden"><div class="top"><button class="small" onclick="goHome()">← 戻る</button><div class="topActions"><button class="small" onclick="toggleLocalSearch('phrase')">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div id="phraseSeasonTitle" class="meta" style="text-align:center;color:#2563eb;font-weight:900"></div><div id="phraseLocalSearch" class="localSearch hidden"><input id="phraseFilter" placeholder="このシーズン内で検索" oninput="renderPhraseList(currentPhraseList,this.value)"></div><div id="phraseFilterBar"></div><div class="title">フレーズ一覧</div><div id="phraseList" class="list"></div></section>
<section id="phraseDetail" class="card hidden"><div id="phraseDetailBody"></div></section>

<section id="roleSeason" class="card hidden"><div class="top"><button class="small" onclick="goHome()">← 戻る</button><div class="topActions"><button class="small" onclick="showSearch()">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div class="title">ロールプレイ：シーズン選択</div><div id="roleSeasonButtons"></div></section>
<section id="roleHome" class="card hidden"><div class="top"><button class="small" onclick="goHome()">← 戻る</button><div class="topActions"><button class="small" onclick="toggleLocalSearch('role')">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div id="roleSeasonTitle" class="meta" style="text-align:center;color:#2563eb;font-weight:900"></div><div id="roleLocalSearch" class="localSearch hidden"><input id="roleFilter" placeholder="このシーズン内で検索" oninput="renderDialogueList(currentDialogueList,this.value)"></div><div id="roleFilterBar"></div><div class="title">ダイアログ一覧</div><div id="dialogueList" class="list"></div></section>

<section id="roleMenu" class="card hidden"><div class="top"><button class="small" onclick="backToRoleSource()">← 戻る</button><div class="topActions"><button class="small" onclick="showSearch()">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div id="chosenTitle" class="title"></div><div id="chosenMeta" class="meta"></div><button class="btn soft" onclick="showMemorize()">📝 暗記表示</button><button class="btn blue" onclick="startRole('A')">A側を練習する</button><button class="btn white" onclick="startRole('B')">B側を練習する</button></section>
<section id="memorize" class="card hidden"><div class="top"><button class="small" onclick="showRoleMenu()">← 戻る</button><div class="topActions"><button class="small" onclick="showSearch()">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div id="memorizeBody"></div></section>
<section id="drill" class="hidden"><div class="top"><button class="small" onclick="showRoleMenu()">← 中断して戻る</button><div class="topActions"><button class="small" onclick="showSearch()">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div class="card"><div class="top"><span id="roleBadge" class="tag"></span><span><span id="progress"></span>/<span id="total"></span></span></div><div id="drillTitle" class="meta"></div><div id="lineBlock" class="hidden"><div class="meta">LINE</div><div id="line" class="box en"></div></div><div id="answerBlock" class="hidden"><div class="meta">ANSWER</div><div id="answer" class="box answer"></div></div><div id="hintBox" class="hintSmall" onclick="toggleRoleHint()"><span class="hintHidden">ヒントを見る</span><div id="hint" class="jp hidden"></div></div><button id="showBtn" class="btn green" onclick="showAnswer()">答えを見る</button><button id="nextBtn" class="btn blue hidden" onclick="nextLine()">次へ</button></div></section>

<section id="bookmarks" class="card hidden"><div class="top"><button class="small" onclick="goHome()">← 戻る</button><div class="topActions"><button class="small" onclick="showSearch()">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div class="title">⭐ ブックマーク</div><div class="guide">保存したフレーズとダイアログだけを復習できます。</div><div id="bookmarkBody"></div></section>


<section id="quizHome" class="card hidden"><div class="top"><button class="small" onclick="goHome()">← 戻る</button><div class="topActions"><button class="small" onclick="showSearch()">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div class="title">🧠 フレーズクイズ</div><div class="guide">4択で定着チェック。不正解になると自動で「🔥苦手」に入り、苦手復習で2回連続正解すると卒業します。</div><div id="quizSummary"></div><button class="btn blue" onclick="startQuiz('random')">ランダム10問</button><button class="btn white" onclick="startQuiz('star3')">★★★だけ</button><button class="btn white" onclick="startQuiz('bookmarked')">⭐保存だけ</button><button class="btn white" onclick="startQuiz('weak')">🔥苦手だけ復習</button><button class="btn soft" onclick="showGraduated()">🎓卒業済みを見る</button></section>

<section id="quizPlay" class="card hidden"><div class="top"><button class="small" onclick="showQuizHome()">← クイズメニュー</button><div class="topActions"><button class="small" onclick="showSearch()">🔍 検索</button><button class="small" onclick="goHome()">🏠 ホーム</button></div></div><div class="top"><span id="quizModeLabel" class="tag"></span><span><span id="quizProgress"></span>/<span id="quizTotal"></span></span></div><div id="quizBody"></div></section>

<section id="quizResult" class="card hidden"><div class="top"><button class="small" onclick="showQuizHome()">← クイズメニュー</button><button class="small" onclick="goHome()">🏠 ホーム</button></div><div class="title">クイズ結果</div><div id="quizResultBody"></div></section>

<section id="search" class="card hidden"><div class="top"><button class="small" onclick="goHome()">← 戻る</button><button class="small" onclick="goHome()">🏠 ホーム</button></div><div class="title">Universal Search</div><input id="searchInput" placeholder="例: run by / 自分を責めすぎないで / bottom" oninput="renderSearch(this.value)"><div id="searchResults"></div></section>
</div>

<div id="confirmOverlay" class="confirmOverlay hidden">
  <div class="confirmBox">
    <div id="confirmText" class="confirmText"></div>
    <div class="confirmBtns">
      <button class="confirmCancel" onclick="closeConfirm()">キャンセル</button>
      <button class="confirmOk" onclick="runConfirm()">リセット</button>
    </div>
  </div>
</div>

<script src="js/app.js" defer></script></body></html>
